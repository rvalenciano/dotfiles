# ==============================================================================
# tmux.conf — Terminal multiplexer configuration
# ==============================================================================

# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- General ---
set -g base-index 1           # Windows start at 1
setw -g pane-base-index 1     # Panes start at 1
set -g renumber-windows on    # Re-number on close
set -g mouse on
set -g history-limit 50000
set -g escape-time 0          # No delay for escape key
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Status bar (top) ---
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 40
set -g status-left "#[bold]  #S #[nobold]"

set -g status-right-length 60
set -g status-right "#[fg=#7aa2f7]%H:%M #[fg=#9ece6a]%d %b"

set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bold,fg=#7aa2f7] #I:#W "
set -g window-status-separator      ""

# --- Split panes ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Resize panes ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded."
